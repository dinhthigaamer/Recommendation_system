/* Single light sheet, like the reference: white canvas, section tints, colored badges. */
:root {

  --orange: #e07b12; --orange-dk: #a95a07; --orange-t: #fff8ec; --orange-b: #f2c98c;

html, body { background: var(--page); }
body { color: var(--ink); font-family: var(--f-body); }
.wrap { overflow-x: auto; padding-block: 16px;

.dg { display: block; width: 100%; max-width: 1400px; min-width: 1060px; height: auto; margin: 0 auto; }
.dg text { font-family: var(--f-body); fill: var(--ink); }
.title { font: 700 38px var(--f-cap) !important; letter-spacing: .02em; fill: var(--ink); }
.subtitle { font-size: 16px; fill: var(--muted) !important; }
.rule { stroke: var(--purple-b); stroke-width: 1.5; fill: none; }

.b { font-weight: 700; }

.dashed { stroke-dasharray: 6 4; stroke-width: 1.6; }

.tagt { font: 700 12px "JetBrains Mono", ui-monospace, Menlo, monospace; }
.cutt { font-size: 10.5px; font-style: italic; fill: var(--coral) !important; }
.cutrow { font-style: italic; }
.cutbox { fill: #fff; stroke: var(--muted); stroke-dasharray: 4 3; }
.el { font-size: 11px; font-weight: 600; paint-order: stroke; stroke: var(--page); stroke-width: 4px; }
.ln.gray { stroke: #8a90a8; } .ln.indigo { stroke: var(--indigo); }
.mk-gray { fill: #8a90a8; } .mk-indigo { fill: var(--indigo); }
</style>
