.app { height: 100%; display: grid; grid-template-rows: auto 1fr; padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); padding-block: 12px; gap: 10px; }
.bar { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 700; margin-right: 6px; }
.brand svg { width: 18px; height: 18px; color: var(--code); }
.sample { font: 600 11px var(--f-mono); color: var(--fb); border: 1px solid currentColor; border-radius: 999px; padding: 1px 8px; }
.tabs { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.tabs button { border: 0; background: transparent; color: var(--muted); padding: 6px 12px; font: 600 13px var(--f-body); cursor: pointer; }
.tabs button[aria-selected="true"] { background: var(--code-t); color: var(--code); }
.ctl { display: inline-flex; gap: 6px; align-items: center; }
.btn { border: 1px solid var(--line); background: var(--panel); color: var(--fg); border-radius: 8px; padding: 6px 12px; font: 600 13px var(--f-body); cursor: pointer; }
.btn.primary { background: var(--code); border-color: var(--code); color: #fff; }
:root[data-theme="dark"] .btn.primary { color: #0f121a; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn.primary { color: #0f121a; } }
.btn:focus-visible, .tabs button:focus-visible, select:focus-visible { outline: 2px solid var(--code); outline-offset: 2px; }
select { border: 1px solid var(--line); background: var(--panel); color: var(--fg); border-radius: 8px; padding: 6px 8px; font: 500 13px var(--f-body); }
.clock { font: 600 12px var(--f-mono); color: var(--muted); font-variant-numeric: tabular-nums; min-width: 70px; }
.main { display: grid; grid-template-columns: minmax(0, 1fr) 310px; gap: 10px; min-height: 0; }
@media (max-width: 860px) { .main { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(420px, 1fr) auto; } .app { height: auto; min-height: 100%; } }
.canvas { background: var(--canvas); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; position: relative; min-height: 420px; }
.side { display: grid; grid-template-rows: minmax(160px, 1fr) auto; gap: 10px; min-height: 0; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; min-height: 0; display: grid; grid-template-rows: auto 1fr; gap: 6px; }
.card h3 { margin: 0; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.log { overflow: auto; font: 500 11.5px/1.5 var(--f-mono); }
.log div { display: grid; grid-template-columns: 28px 46px 1fr; gap: 6px; padding: 2px 4px; border-radius: 4px; }
.log div.new { background: var(--code-t); }
.log .t { color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
.ty-run_started, .ty-run_finished { color: var(--code); }
.ty-step_started { color: var(--run); } .ty-step_finished { color: var(--ok); } .ty-edge { color: var(--loop); }
.detail dl { margin: 0; display: grid; grid-template-columns: 74px 1fr; gap: 4px 10px; font-size: 12.5px; }
.detail dt { color: var(--muted); }
.detail dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.empty { color: var(--muted); font-size: 12.5px; }
/* nodes */
.nd { background: var(--panel); border: 1.5px solid var(--k); border-radius: 10px; padding: 8px 10px; width: 200px; display: grid; grid-template-columns: auto 1fr auto; gap: 2px 8px; align-items: center; color: var(--fg); box-shadow: 0 1px 2px rgba(0,0,0,.06); }
.nd .ico { grid-row: span 2; width: 30px; height: 30px; border-radius: 8px; background: var(--kt); display: grid; place-items: center; }
.nd .ico svg { width: 17px; height: 17px; color: var(--k); }
.nd .nt { font-weight: 700; font-size: 13px; }
.nd .ns { font-size: 11px; color: var(--muted); grid-column: 2 / 4; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nd .pill { font: 700 9.5px var(--f-mono); color: var(--k); background: var(--kt); border-radius: 999px; padding: 1px 6px; }
.nd.sel { box-shadow: 0 0 0 3px var(--kt); }
.nd.active { border-color: var(--run); box-shadow: 0 0 0 4px color-mix(in srgb, var(--run) 25%, transparent); animation: pulse 1.1s ease-in-out infinite; }
.nd.st-ok { border-color: var(--ok); } .nd.st-fallback { border-color: var(--fb); border-style: dashed; }
.nd.st-skipped { border-color: var(--skip); border-style: dashed; opacity: .75; } .nd.st-error { border-color: var(--err); }
.nd .st { font: 600 10.5px var(--f-mono); grid-column: 2 / 4; display: flex; gap: 6px; align-items: center; }
.nd .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--c); }
.k-code { --k: var(--code); --kt: var(--code-t); } .k-llm { --k: var(--llm); --kt: var(--llm-t); }
.k-tool { --k: var(--tool); --kt: var(--tool-t); } .k-ext { --k: var(--ext); --kt: var(--ext-t); } .k-store { --k: var(--store); --kt: var(--store-t); }
@keyframes pulse { 50% { box-shadow: 0 0 0 7px color-mix(in srgb, var(--run) 10%, transparent); } }
@media (prefers-reduced-motion: reduce) { .nd.active { animation: none; } }
.react-flow__handle { opacity: 0; }
.react-flow__edge-textbg { fill: var(--canvas); }
.react-flow__edge-text { fill: var(--loop); font: 600 11px var(--f-body); }
/* timeline */
.tl { position: absolute; inset: 0; overflow: auto; padding: 14px; }
.tl svg text { font: 500 11.5px var(--f-body); fill: var(--fg); }
.tl .ax { font: 500 10.5px var(--f-mono); fill: var(--muted); }
.tl .grid { stroke: var(--line); }
.tl rect.bar-ok { fill: var(--ok); } .tl rect.bar-fallback { fill: var(--fb); } .tl rect.bar-skipped { fill: var(--skip); }
.tl rect.bar-running { fill: var(--run); } .tl rect.bar-error { fill: var(--err); }
.tl rect.sel { stroke: var(--fg); stroke-width: 2; }
.tl .bl { font: 600 10.5px var(--f-mono); fill: #fff; pointer-events: none; }
.hint { position: absolute; left: 12px; bottom: 12px; font-size: 12px; color: var(--muted); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 4px 10px; pointer-events: none; }

const { useState, useMemo, useEffect, useRef, useCallback } = React;
const h = React.createElement;
const RF = window.ReactFlow;

/* ---------- sample runs (shape matches the planned run_events table) ---------- */
const COMP = {
  ui: ["Web app", "app_demo", "list-ordered", "code"], api: ["API", "FastAPI · api.py", "server", "code"],
  controller: ["Bộ điều khiển", "flow.py · RunState", "cpu", "code"], tools: ["Công cụ ML", "RRF · pool 30", "layers", "tool"],
  profiler: ["Profiler", "agent LLM", "scan-search", "llm"], planner: ["Planner", "agent LLM", "search", "llm"],
  verifier: ["Verifier", "agent LLM", "shield-check", "llm"], critic: ["Critic", "agent LLM", "gavel", "llm"],
  webscout: ["WebScout", "LLM + web_search", "globe", "llm"], openai: ["OpenAI", "gpt-5.4-mini", "sparkles", "ext"],
  sqlite: ["SQLite", "catalog · hồ sơ · trace", "database", "store"],
};
const CALL = (c, ...more) => [["controller", c], ...more];
const LLM = (c) => CALL(c, [c, "openai"]);
const S = (step, kind, agent, component, from, ms, status, calls, extra = {}) =>
  ({ step, kind, agent, component, from, ms, status, calls, ...extra });

const RUNS = {
  full: { label: "Luồng 1 · đủ agent", user: 1, stream: "s1", steps: [
    S("S0", "code", "Nạp dữ liệu", "controller", [], 40, "ok", [["controller", "sqlite"]], { in: "user_id = 1", out: "40 lượt chấm, 2 phản hồi, hồ sơ cũ" }),

    S("S2", "code", "Kế hoạch mặc định", "controller", ["S1"], 5, "ok", [], { out: "4 nguồn × 50: user_cf, item_cf, svd, tfidf_anchor" }),
    S("S3", "tool", "Truy xuất + RRF", "tools", ["S2"], 600, "ok", CALL("tools", ["tools", "sqlite"]), { out: "RRF → 30 ứng viên" }),

    S("S6", "llm", "Critic", "critic", ["S5"], 2400, "ok", LLM("critic"), { tok: [2600, 380], in: "10 cuốn + fit + lý do", out: "2 reject (duplicate_feel) · revision: cap_per_author, prefer_less_popular" }),
    S("S7", "llm", "Vòng sửa", "verifier", ["S6"], 2900, "ok", CALL("tools", ["controller", "verifier"], ["verifier", "openai"]), { tok: [1900, 600], loop: ["S3", "truy xuất lại"], out: "+8 ứng viên mới, Verifier chấm 8, chấm lại" }),

    S("S9", "code", "Ghi trace + snapshot", "controller", ["S8"], 20, "ok", [["controller", "sqlite"]], { out: "snapshot (user 1, feedback_version 0)" }),
  ] },
  nokey: { label: "Luồng 1 · không có key", user: 1, stream: "s1", steps: [
    S("S0", "code", "Nạp dữ liệu", "controller", [], 40, "ok", [["controller", "sqlite"]], { in: "user_id = 1", out: "40 lượt chấm, chưa có hồ sơ" }),
    S("S1", "llm", "Profiler", "profiler", ["S0"], 15, "fallback", CALL("profiler"), { in: "client = None", out: "no_client → hồ sơ đơn giản dựng từ thể loại" }),
    S("S2", "code", "Kế hoạch mặc định", "controller", ["S1"], 5, "ok", [], { out: "4 nguồn × 50" }),
    S("S3", "tool", "Truy xuất + RRF", "tools", ["S2"], 600, "ok", CALL("tools", ["tools", "sqlite"]), { out: "RRF → 30 ứng viên" }),

function toEvents(run) {
  const ev = [];
  let t = 0, seq = 0;
  ev.push({ seq: ++seq, type: "run_started", t_ms: 0, stream: run.stream, user_id: run.user, calls: [["ui", "api"], ["api", "controller"]] });
  t = 120;
  for (const s of run.steps) {
    ev.push({ seq: ++seq, type: "step_started", t_ms: t, step: s.step, kind: s.kind, agent: s.agent, component: s.component, from: s.from, calls: s.calls });
    if (s.loop) ev.push({ seq: ++seq, type: "edge", t_ms: t, from: s.step, to: s.loop[0], label: s.loop[1] });
    t += s.ms;
    ev.push({ seq: ++seq, type: "step_finished", t_ms: t, step: s.step, status: s.status, ms: s.ms,
      tokens_in: s.tok ? s.tok[0] : 0, tokens_out: s.tok ? s.tok[1] : 0, in: s.in, out: s.out });
    t += 60;
  }
  const llm = run.steps.filter(s => s.tok).length;
  ev.push({ seq: ++seq, type: "run_finished", t_ms: t, status: "done",
    label: run.steps.some(s => s.status !== "ok") ? "fallback" : "full", llm_calls: llm, calls: [["api", "ui"]] });
  return ev;
}

/* ---------- reducer: events -> graph state (pure) ---------- */
function reduce(events) {
  const g = { hld: { nodes: new Map(), edges: new Map() }, arch: { nodes: new Map(), edges: new Map() }, bars: [], active: new Map(), done: false };
  const touch = (c) => { if (!g.hld.nodes.has(c)) g.hld.nodes.set(c, { id: c, calls: 0, ms: 0 }); return g.hld.nodes.get(c); };
  const link = (a, b) => { touch(a); touch(b); const id = a + ">" + b; const e = g.hld.edges.get(id) || { id, source: a, target: b, n: 0 }; e.n++; g.hld.edges.set(id, e); };
  const running = new Map();
  for (const e of events) {
    if (e.calls) e.calls.forEach(([a, b]) => link(a, b));
    if (e.type === "step_started") {
      touch(e.component).calls++;
      const comps = new Set([e.component, ...(e.calls || []).flat().filter(c => c !== "controller")]);
      running.set(e.step, comps);
      g.arch.nodes.set(e.step, { id: e.step, agent: e.agent, kind: e.kind, component: e.component, status: "running", t0: e.t_ms });
      e.from.forEach(f => g.arch.edges.set(f + ">" + e.step, { id: f + ">" + e.step, source: f, target: e.step }));
      g.bars.push({ step: e.step, lane: COMP[e.component][0], start: e.t_ms, end: null, status: "running" });
    } else if (e.type === "step_finished") {
      Object.assign(g.arch.nodes.get(e.step), { status: e.status, ms: e.ms, tin: e.tokens_in, tout: e.tokens_out, in: e.in, out: e.out });
      const comp = g.arch.nodes.get(e.step).component;
      touch(comp).ms += e.ms;
      running.delete(e.step);
      const b = g.bars.find(x => x.step === e.step);
      Object.assign(b, { end: e.t_ms, status: e.status });
    } else if (e.type === "edge") {
      g.arch.edges.set("loop:" + e.from, { id: "loop:" + e.from, source: e.from, target: e.to, label: e.label, loop: true });
    } else if (e.type === "run_finished") {
      g.done = true; g.label = e.label; g.llm = e.llm_calls;
    }
  }
  running.forEach(set => set.forEach(c => g.active.set(c, true)));
  return g;
}

/* ---------- layout ---------- */
const NW = 220, NH = 62;
function layout(nodes, edges, dir) {
  const g = new dagre.graphlib.Graph();
  g.setGraph({ rankdir: dir, nodesep: 36, ranksep: dir === "LR" ? 90 : 46, marginx: 20, marginy: 20 });
  g.setDefaultEdgeLabel(() => ({}));
  nodes.forEach(n => g.setNode(n.id, { width: NW, height: NH }));
  edges.filter(e => !e.loop).forEach(e => g.setEdge(e.source, e.target));
  dagre.layout(g);
  const pos = {};
  nodes.forEach(n => { const p = g.node(n.id); pos[n.id] = { x: p.x - NW / 2, y: p.y - NH / 2 }; });
  return pos;
}

/* ---------- nodes ---------- */
const Icon = ({ name }) => h("svg", { "aria-hidden": "true" }, h("use", { href: "#i-" + name }));
const STATUS = { running: ["đang chạy", "var(--run)"], ok: ["ok", "var(--ok)"], fallback: ["fallback", "var(--fb)"],
  skipped: ["bỏ qua", "var(--skip)"], error: ["lỗi", "var(--err)"] };
const handles = (vertical) => [
  h(RF.Handle, { key: "t", type: "target", position: vertical ? RF.Position.Top : RF.Position.Left }),
  h(RF.Handle, { key: "s", type: "source", position: vertical ? RF.Position.Bottom : RF.Position.Right }),
  h(RF.Handle, { key: "lo", id: "loop-out", type: "source", position: RF.Position.Right }),
  h(RF.Handle, { key: "li", id: "loop-in", type: "target", position: RF.Position.Right }),
];
function CompNode({ data }) {
  const [name, sub, icon, kind] = COMP[data.id];
  return h("div", { className: `nd k-${kind}${data.active ? " active" : ""}${data.sel ? " sel" : ""}` },
    ...handles(false),
    h("div", { className: "ico" }, h(Icon, { name: icon })),
    h("div", { className: "nt" }, name),
    h("span", { className: "pill" }, kind === "ext" ? "ngoài" : kind === "store" ? "store" : kind === "llm" ? "LLM" : kind),
    h("div", { className: "ns" }, data.calls ? `${sub} · ${data.calls} lượt · ${(data.ms / 1000).toFixed(1)} s` : sub));
}
function StepNode({ data }) {
  const [label, color] = STATUS[data.status];
  const icon = COMP[data.component][2];
  return h("div", { className: `nd k-${data.kind} st-${data.status}${data.status === "running" ? " active" : ""}${data.sel ? " sel" : ""}` },
    ...handles(true),
    h("div", { className: "ico" }, h(Icon, { name: icon })),
    h("div", { className: "nt" }, `${data.id} · ${data.agent}`),
    h("span", { className: "pill" }, data.kind === "llm" ? "LLM" : data.kind),
    h("div", { className: "st", style: { "--c": color } }, h("span", { className: "dot" }),
      data.ms != null ? `${label} · ${data.ms >= 1000 ? (data.ms / 1000).toFixed(1) + " s" : data.ms + " ms"}` : label));
}
const NODE_TYPES = { comp: CompNode, step: StepNode };

function FlowView({ gNodes, gEdges, dir, type, sel, onSelect, colorMode }) {
  const [nodes, setNodes] = useState([]);
  const dragged = useRef({});
  const inst = useRef(null);
  const key = gNodes.map(n => n.id).join("|") + "#" + gEdges.map(e => e.id).join("|");
  const pos = useMemo(() => layout(gNodes, gEdges, dir), [key, dir]);
  useEffect(() => {
    setNodes(gNodes.map(n => ({ id: n.id, type, position: dragged.current[n.id] || pos[n.id], data: { ...n, sel: n.id === sel } })));
  }, [gNodes, pos, sel, type]);
  useEffect(() => { const t = setTimeout(() => inst.current && inst.current.fitView({ padding: 0.12, maxZoom: 1, duration: 250 }), 30); return () => clearTimeout(t); }, [key]);
  const onNodesChange = useCallback(ch => {
    setNodes(ns => RF.applyNodeChanges(ch, ns));
    ch.forEach(c => { if (c.type === "position" && c.position) dragged.current[c.id] = c.position; });
  }, []);
  const edges = gEdges.map(e => {
    const color = e.loop ? "var(--loop)" : e.hot ? "var(--run)" : "var(--skip)";
    return { id: e.id, source: e.source, target: e.target, type: e.loop ? "smoothstep" : "step", animated: !!e.hot || !!e.loop,
      sourceHandle: e.loop ? "loop-out" : undefined, targetHandle: e.loop ? "loop-in" : undefined,
      pathOptions: e.loop ? { offset: 70 } : undefined, labelBgPadding: [6, 3],
      label: e.label, style: { stroke: color, strokeWidth: e.loop ? 2 : 1.6 }, markerEnd: { type: RF.MarkerType.ArrowClosed, color } };
  });
  return h(RF.ReactFlow, { nodes, edges, nodeTypes: NODE_TYPES, onNodesChange, colorMode,
      onInit: i => { inst.current = i; i.fitView({ padding: 0.12, maxZoom: 1 }); }, onNodeClick: (_, n) => onSelect(n.id),
      minZoom: 0.3, maxZoom: 1.8, nodesConnectable: false, proOptions: { hideAttribution: false } },
    h(RF.Background, { variant: RF.BackgroundVariant.Dots, gap: 18, size: 1.4, color: "var(--dot)" }),
    h(RF.Controls, { showInteractive: false }));
}

function Timeline({ g, now, sel, onSelect }) {
  const lanes = [...new Set(g.bars.map(b => b.lane))];
  const end = Math.max(1000, ...g.bars.map(b => b.end ?? now));
  const W = 900, L = 120, R = 20, LH = 34, top = 26;
  const x = t => L + (t / end) * (W - L - R);
  const ticks = []; for (let s = 0; s * 1000 <= end; s += end > 8000 ? 2 : 1) ticks.push(s);
  return h("div", { className: "tl" }, h("svg", { viewBox: `0 0 ${W} ${top + lanes.length * LH + 10}`, width: "100%", style: { minWidth: 640 } },
    ticks.map(s => h("g", { key: s }, h("line", { className: "grid", x1: x(s * 1000), x2: x(s * 1000), y1: top - 6, y2: top + lanes.length * LH }),
      h("text", { className: "ax", x: x(s * 1000), y: 12, textAnchor: "middle" }, s + " s"))),
    lanes.map((ln, i) => h("text", { key: ln, x: 0, y: top + i * LH + 21 }, ln)),
    g.bars.map(b => {
      const i = lanes.indexOf(b.lane), x0 = x(b.start), x1 = x(b.end ?? now), w = Math.max(3, x1 - x0);
      return h("g", { key: b.step, style: { cursor: "pointer" }, onClick: () => onSelect(b.step) },
        h("rect", { x: x0, y: top + i * LH + 6, width: w, height: 22, rx: 4, className: `bar-${b.status}${sel === b.step ? " sel" : ""}` }),
        w > 34 ? h("text", { className: "bl", x: x0 + 6, y: top + i * LH + 21 }, b.step) : null);
    })));
}

function useColorMode() {
  const get = () => { const t = document.documentElement.dataset.theme; if (t === "dark" || t === "light") return t;
    return matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"; };
  const [m, setM] = useState(get);
  useEffect(() => { const mq = matchMedia("(prefers-color-scheme: dark)"); const f = () => setM(get()); mq.addEventListener("change", f);
    const mo = new MutationObserver(f); mo.observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
    return () => { mq.removeEventListener("change", f); mo.disconnect(); }; }, []);
  return m;
}

function App() {
  const [runKey, setRunKey] = useState("full");
  const events = useMemo(() => toEvents(RUNS[runKey]), [runKey]);
  const total = events[events.length - 1].t_ms;
  const [now, setNow] = useState(total);
  const [playing, setPlaying] = useState(false);
  const [speed, setSpeed] = useState(1);
  const [tab, setTab] = useState("arch");
  const [sel, setSel] = useState(null);
  const colorMode = useColorMode();
  const logRef = useRef(null);

  useEffect(() => { setNow(toEvents(RUNS[runKey]).slice(-1)[0].t_ms); setPlaying(false); setSel(null); }, [runKey]);
  useEffect(() => {
    if (!playing) return;
    let raf, last = performance.now();
    const tick = t => { const dt = t - last; last = t;
      setNow(n => { const v = n + dt * speed; if (v >= total) { setPlaying(false); return total; } return v; });
      raf = requestAnimationFrame(tick); };
    raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
  }, [playing, speed, total]);

  const seen = events.filter(e => e.t_ms <= now);
  const g = useMemo(() => reduce(seen), [seen.length, runKey]);
  useEffect(() => { if (logRef.current) logRef.current.scrollTop = logRef.current.scrollHeight; }, [seen.length]);

  const hldNodes = [...g.hld.nodes.values()].map(n => ({ ...n, active: g.active.has(n.id) }));
  const hldEdges = [...g.hld.edges.values()].map(e => ({ ...e, hot: g.active.has(e.target) }));
  const archNodes = [...g.arch.nodes.values()];
  const archEdges = [...g.arch.edges.values()].map(e => ({ ...e, hot: g.arch.nodes.get(e.target)?.status === "running" }));

  const replay = () => { setNow(0); setSel(null); setPlaying(true); };
  const step = sel && g.arch.nodes.get(sel);
  const comp = sel && !step && COMP[sel] ? g.hld.nodes.get(sel) : null;

  const detail = step ? h("dl", null,
      h("dt", null, "Bước"), h("dd", null, `${step.id} · ${step.agent}`),
      h("dt", null, "Loại"), h("dd", null, step.kind === "llm" ? "LLM" : step.kind),
      h("dt", null, "Trạng thái"), h("dd", null, STATUS[step.status][0] + (step.ms != null ? ` · ${step.ms} ms` : "")),
      step.tin ? [h("dt", { key: "a" }, "Token"), h("dd", { key: "b" }, `${step.tin} vào · ${step.tout} ra`)] : null,
      step.in ? [h("dt", { key: "c" }, "Input"), h("dd", { key: "d" }, step.in)] : null,
      step.out ? [h("dt", { key: "e" }, "Output"), h("dd", { key: "f" }, step.out)] : null)
    : comp ? h("dl", null,
      h("dt", null, "Thành phần"), h("dd", null, COMP[comp.id][0]),
      h("dt", null, "Vai trò"), h("dd", null, COMP[comp.id][1]),
      h("dt", null, "Số bước"), h("dd", null, String(comp.calls)),
      h("dt", null, "Thời gian"), h("dd", null, (comp.ms / 1000).toFixed(2) + " s"))
    : h("p", { className: "empty" }, "Bấm một node hoặc một thanh để xem input, output và thời gian.");

  return h("div", { className: "app" },
    h("div", { className: "bar" },
      h("div", { className: "brand" }, h(Icon, { name: "git-fork" }), "Agent Workflow"),
      h("span", { className: "sample", title: "Sự kiện mẫu theo đúng schema run_events, chưa nối backend" }, "dữ liệu mẫu"),
      h("div", { className: "tabs", role: "tablist" },
        [["hld", "HLD"], ["arch", "Kiến trúc"], ["tl", "Timeline"]].map(([k, l]) =>
          h("button", { key: k, role: "tab", "aria-selected": tab === k, onClick: () => setTab(k), id: "tab-" + k }, l))),
      h("select", { id: "run", value: runKey, onChange: e => setRunKey(e.target.value), "aria-label": "Chọn lần chạy" },
        Object.entries(RUNS).map(([k, r]) => h("option", { key: k, value: k }, r.label))),
      h("div", { className: "ctl" },
        h("button", { className: "btn primary", onClick: replay, id: "replay" }, "Phát lại"),
        h("button", { className: "btn", onClick: () => (now >= total ? replay() : setPlaying(p => !p)), id: "pause" }, playing ? "Tạm dừng" : "Tiếp"),
        h("button", { className: "btn", onClick: () => { setPlaying(false); setNow(total); }, id: "end" }, "Hiện hết"),
        h("select", { id: "speed", value: speed, onChange: e => setSpeed(Number(e.target.value)), "aria-label": "Tốc độ" },
          [1, 2, 4].map(v => h("option", { key: v, value: v }, v + "×")))),
      h("span", { className: "clock" }, `${(now / 1000).toFixed(1)} / ${(total / 1000).toFixed(1)} s`)),
    h("div", { className: "main" },
      h("div", { className: "canvas" },
        tab === "hld" ? h(FlowView, { key: "hld" + runKey, gNodes: hldNodes, gEdges: hldEdges, dir: "LR", type: "comp", sel, onSelect: setSel, colorMode })
          : tab === "arch" ? h(FlowView, { key: "arch" + runKey, gNodes: archNodes, gEdges: archEdges, dir: "TB", type: "step", sel, onSelect: setSel, colorMode })
          : h(Timeline, { g, now, sel, onSelect: setSel }),
        h("div", { className: "hint" }, g.done ? `Xong · nhãn ${g.label} · ${g.llm} lời gọi LLM` : playing ? "Đang nhận sự kiện…" : "Tạm dừng")),
      h("div", { className: "side" },
        h("div", { className: "card" }, h("h3", null, `Sự kiện · ${seen.length}/${events.length}`),
          h("div", { className: "log", ref: logRef }, seen.map((e, i) => h("div", { key: e.seq, className: i === seen.length - 1 && playing ? "new" : "" },
            h("span", { className: "t" }, e.seq), h("span", { className: "t" }, (e.t_ms / 1000).toFixed(2)),
            h("span", { className: "ty-" + e.type }, e.type + (e.step ? " " + e.step : e.type === "edge" ? ` ${e.from}→${e.to}` : "")))))),
        h("div", { className: "card detail" }, h("h3", null, "Chi tiết"), detail))));
}

ReactDOM.createRoot(document.getElementById("root")).render(h(App));
</script>

</body>
</html>
